# Specwright settings. Read by the specwright-* skills; OpenSpec ignores this file.

# How a change finishes after archive:
#   local - merge the feature branch into main with --no-ff, no push
#   pr    - archive on the branch, push to the PR; GitHub merges
finish: local

# Main branch. Omit to detect (main, else master).
# main_branch: main

github:
  # Account for push, PR creation, replies and thread resolution.
  # Empty = whatever gh is logged in as (unsafe when agents run concurrently).
  login: ""
  # Comment posted once on each new PR to request a review. Empty = none.
  review_request:
    body: ""
    login: ""
    # true = post it again after each fix round the agent pushes, for
    # reviewers that only run when tagged (Codex). At most once per head.
    after_fixes: false

review:
  # Design reviews (FULL tier and the roadmap baseline) prefer a different
  # model's CLI (Claude author -> codex, Codex author -> claude).
  # false = always use the fresh-context specwright-reviewer agent instead.
  cross_model: true

project:
  # Project-level files used by specwright-roadmap. Point these at existing
  # documents instead of duplicating them.
  strategy: openspec/strategy.md
  architecture: openspec/architecture.md   # system shape + index of in-force ADRs
  roadmap: openspec/roadmap.md
  adr_dir: docs/adr

pr:
  # Command that must pass before every push. Empty = none.
  validate: ""
  # address-review-feedback commits allowed per PR.
  max_fix_rounds: 2
  # At the limit every finding is still answered. ask = reply "waiting on
  # owner" and stop (the user decides), issues = file each new actionable
  # finding as an issue, reply with the link and resolve, stop = like ask,
  # without offering more rounds.
  after_limit: ask
  # true = put a thumbs up (finding right) or down (wrong) on every finding
  # answered, alongside the one reply.
  react: false
  # Reviewers keyed by login (without [bot]). role: required | advisory,
  # timeout: wait per head (default 20m), request: comment that triggers a
  # reviewer that only runs when tagged. Replaces github.review_request.
  # reviewers:
  #   chatgpt-codex-connector: { role: required, request: "@codex review" }
  #   kody-ai: { role: advisory, timeout: 15m }
  #   kintsugimira: { role: advisory, timeout: 10m }
  # Account that posts the requests. Default: review_request.login, else
  # github.login.
  # request_as: ""
